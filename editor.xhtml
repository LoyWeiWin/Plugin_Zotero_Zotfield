<?xml version="1.0"?>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>ZotFields — Item metadata</title>
    <script src="chrome://zotfields/content/editor.js"></script>
    <style>
      body { font: 14px system-ui; padding: 16px; background: Canvas; color: CanvasText; }
      button, select, input, textarea { font: inherit; }
      button, select { margin: 4px 0; padding: 5px; max-width: 100%; }
      #item-title { font-weight: 600; overflow-wrap: anywhere; }
      [role="status"] { min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Research metadata</h1>
    <p id="item-title"></p>
    <p>Values save automatically for this item.</p>
    <div id="item-fields"></div>
  </body>
</html>
